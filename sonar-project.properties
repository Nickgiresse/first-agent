# Analyse SonarQube (charte backend §10, charte frontend §7.3).
#
# Ce fichier décrit le projet ; il ne déclenche rien par lui-même. L'analyse
# suppose un serveur SonarQube accessible et un jeton, tous deux absents à ce
# jour. Le fichier est versionné maintenant pour que le raccordement se limite
# à fournir l'URL et le jeton, sans avoir à redécouvrir le périmètre.
#
# Lancement, une fois le serveur disponible :
#
#   sonar-scanner -Dsonar.host.url=<url> -Dsonar.token=<jeton>
#
# Le jeton ne doit jamais figurer ici : la charte backend §7 proscrit tout
# secret versionné.

sonar.projectKey=afriland-firstagent-onboarding
sonar.projectName=FirstAgent - Microservice d'onboarding
sonar.projectVersion=0.0.1

# ── Périmètre ───────────────────────────────────────────────
# Les trois stacks du dépôt. Le service Python porte l'OCR, la reconnaissance
# faciale et la vivacité : l'écarter laisserait hors analyse le code le plus
# sensible du parcours.
sonar.sources=backend/firstagent-domain/src/main,backend/firstagent-commons/src/main,backend/firstagent-application/src/main,backend/firstagent-infrastructure/src/main,backend/firstagent-boot/src/main,frontend/src,python-service/app
sonar.tests=backend/firstagent-domain/src/test,backend/firstagent-commons/src/test,backend/firstagent-infrastructure/src/test,backend/firstagent-boot/src/test,python-service/tests

sonar.sourceEncoding=UTF-8

# ── Exclusions ──────────────────────────────────────────────
# Code produit, dépendances et ressources binaires : les analyser ne dit rien
# sur la qualité de ce qui est écrit ici, et noie les vrais signalements.
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/__pycache__/**,\
  **/weights/**,\
  frontend/public/assets/fonts/**

# Les migrations de base ne se refactorent pas : une fois appliquées, leur
# checksum est figé et toute modification casse Flyway. Les signaler serait
# proposer une correction impossible à faire.
sonar.issue.ignore.multicriteria=migrations
sonar.issue.ignore.multicriteria.migrations.ruleKey=*
sonar.issue.ignore.multicriteria.migrations.resourceKey=**/db/migration/**

# ── Rapports de couverture ──────────────────────────────────
# Produits par JaCoCo côté Java. Le frontend et le service Python n'en
# produisent pas encore : leurs chemins sont déclarés pour que le jour où ils
# existent, rien d'autre ne soit à changer.
sonar.coverage.jacoco.xmlReportPaths=\
  backend/firstagent-domain/target/site/jacoco/jacoco.xml,\
  backend/firstagent-commons/target/site/jacoco/jacoco.xml,\
  backend/firstagent-application/target/site/jacoco/jacoco.xml,\
  backend/firstagent-infrastructure/target/site/jacoco/jacoco.xml,\
  backend/firstagent-boot/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=python-service/coverage.xml

sonar.java.binaries=backend/*/target/classes
sonar.java.source=21

# ── Seuil ───────────────────────────────────────────────────
# La charte frontend §7.3 fixe 80 % sur le code nouveau, et non sur l'ensemble.
# La distinction compte : exiger 80 % du parc existant bloquerait toute
# livraison, alors que l'exiger du code nouveau fait monter la couverture sans
# arrêter le travail. Ce seuil se règle dans la porte qualité du serveur, pas
# ici ; il est rappelé pour que le raccordement ne l'oublie pas.
