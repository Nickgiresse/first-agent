<main class="journey">
    <aside class="journey-aside"><a class="brand" href="/onboarding/welcome"><img src="afriland-first-bank-logo.png"
                alt="">Afriland First Bank</a>
        <h1>Protégez votre accès.</h1>
        <p>Votre PIN est personnel. Il sera demandé pour les opérations sensibles.</p>
    </aside>
    <section class="journey-main">
        <form class="form-shell" [formGroup]="form">
            <button type="button" class="back-link" (click)="goBack()">← Retour</button>
            <div class="progress-meta"><span>Étape 3 sur 3</span><span>100 % complété</span></div>
            <div class="progress"><span style="width:100%"></span></div>
            <h2>Créez votre code PIN</h2>
            <p class="lead">Choisissez un code personnel de 4 à 6 chiffres.</p><label class="field-label" for="pin">Code
                PIN</label><input id="pin" class="text-field" type="password" inputmode="numeric" maxlength="6"
                formControlName="pin" (input)="digits('pin')"><label class="field-label pin-label"
                for="confirmation">Confirmez votre code PIN</label><input id="confirmation" class="text-field"
                type="password" inputmode="numeric" maxlength="6" formControlName="confirmation"
                (input)="digits('confirmation')">@if(error()){<span class="form-error">{{error()}}</span>}<button
                class="primary-button" type="button" (click)="submit()"
                [disabled]="submitting()">{{submitting()?'Création…':'Créer mon code PIN'}}</button><a class="pin-reset"
                href="/forgot-pin">Vous avez oublié votre PIN ?</a>
        </form>
    </section>
</main>
