<main class="success">
    <div class="confetti-layer" aria-hidden="true">
        @for (piece of confetti; track $index) {
            <span
                class="confetti-piece"
                [style.left.%]="piece.left"
                [style.background]="piece.color"
                [style.animation-delay.s]="piece.delay"
                [style.animation-duration.s]="piece.duration"
                [style.--rotation]="piece.rotation + 'deg'"
                [style.--drift]="piece.drift + 'px'"
            ></span>
        }
    </div>
    <section>
        <img src="afriland-first-bank-logo.png" alt="Afriland First Bank">
        <div class="check">✓</div>
        <h1>Vous avez créé votre compte !</h1>
        <p>Votre inscription est terminée. Vous pouvez maintenant poursuivre vos échanges via WhatsApp.</p>
        <a class="primary-button" [href]="whatsappUrl" target="_blank" rel="noopener">Retour au chat WhatsApp</a>
    </section>
</main>
