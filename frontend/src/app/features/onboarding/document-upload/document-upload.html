<main class="journey">
    <aside class="journey-aside">
        <a class="brand" href="/onboarding/welcome">
            <img src="afriland-first-bank-logo.png" alt="Afriland First Bank">
            Afriland First Bank
        </a>
        <h1>Justificatif d’identité</h1>
        <p>Déposez les deux faces de votre CNI pour finaliser la vérification.</p>
    </aside>
    <section class="journey-main">
        <div class="form-shell">
            <button type="button" class="back-link" (click)="goBack()">← Retour</button>
            <h2>Ajoutez votre Pièce d'Identité</h2>
            <p class="lead">Formats acceptés : JPG ou PNG, 5 Mo maximum par fichier.</p>

            <label class="upload-zone" [class.done]="front()" [class.has-preview]="frontPreview()">
                @if (frontPreview()) {
                    <img [src]="frontPreview()" alt="Aperçu Recto" class="preview-thumb" />
                }
                <div>
                    <b>Recto de la CNI</b><br>
                    <span>{{ front()?.name || 'Choisir un fichier' }}</span>
                </div>
                <input type="file" accept="image/jpeg,image/png" (change)="pick($event, 'front')" [disabled]="sending()" />
            </label>

            <label class="upload-zone" [class.done]="back()" [class.has-preview]="backPreview()">
                @if (backPreview()) {
                    <img [src]="backPreview()" alt="Aperçu Verso" class="preview-thumb" />
                }
                <div>
                    <b>Verso de la CNI</b><br>
                    <span>{{ back()?.name || 'Choisir un fichier' }}</span>
                </div>
                <input type="file" accept="image/jpeg,image/png" (change)="pick($event, 'back')" [disabled]="sending()" />
            </label>

            @if (sending()) {
                <div class="status-box">
                    <span>⏳ {{ statusMessage() }}</span>
                </div>
            }

            @if (error()) {
                <span class="form-error">{{ error() }}</span>
            }

            <button class="primary-button" type="button" [disabled]="!front() || !back() || sending()" (click)="submit()">
                {{ sending() ? statusMessage() : 'Continuer' }}
            </button>
        </div>
    </section>
</main>
