<main class="reset"><section class="form-shell"><a class="brand" href="/onboarding/welcome"><img src="afriland-first-bank-logo.png" alt="Afriland First Bank"></a><h2>Réinitialiser votre PIN</h2><p class="lead">Saisissez votre numéro de compte complet, sur 23 chiffres.</p><label class="field-label" for="account">Numéro de compte</label><input class="text-field" id="account" inputmode="numeric" maxlength="23" [formControl]="account">@if(account.touched&&account.invalid){<span class="form-error">Le numéro doit contenir 23 chiffres.</span>}@if(message()){<p class="notice">{{message()}}</p>}@else{<button class="primary-button" [disabled]="account.invalid" (click)="submit()">Envoyer les instructions</button>}<a class="back" href="/onboarding/welcome">Retour à l’accueil</a></section></main>
