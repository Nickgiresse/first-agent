# Parcours d'onboarding FirstAgent : SPA Angular et relais vers le backend.
#
# Reprend la configuration du conteneur déjà en service, avec une politique de
# sécurité resserrée : ce parcours embarque ses polices, il n'a donc plus
# besoin d'autoriser fonts.googleapis.com ni fonts.gstatic.com.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Résolveur interne de Docker : le nom du service backend est résolu à
    # chaque requête et non une fois au démarrage, de sorte qu'un redémarrage
    # du backend ne fige pas nginx sur une adresse morte.
    resolver 127.0.0.11 valid=10s;

    location /api/v1/ {
        set $spring http://onboarding:8080;
        proxy_pass $spring$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les pièces d'identité et les salves d'images de vivacité dépassent
        # largement la limite par défaut de 1 Mo.
        client_max_body_size 20m;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    # La caméra reste autorisée : le scan de la pièce et le défi de vivacité en
    # dépendent. `img-src data:` couvre les aperçus des deux faces, `blob:` les
    # images capturées.
    #
    # Ni `fonts.googleapis.com` ni `fonts.gstatic.com` ici, contrairement au
    # conteneur précédent : les polices sont désormais servies depuis le
    # dossier `assets`, ce qui referme deux origines externes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'" always;

    # Les fichiers de police portent une empreinte dans leur nom : ils peuvent
    # être gardés longtemps sans risque de servir une version périmée.
    location /assets/fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
