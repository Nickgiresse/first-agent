spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/firstagent_onboarding
    username: postgres
    password: postgre
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway gère le schéma, Hibernate ne fait que valider
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false        # bonne pratique : évite les problèmes de lazy-loading hors contexte

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:agent_dri_03@afrilandfirstbank.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    upload-dir: ./uploads
  mail:
    from-address: ${MAIL_FROM_ADDRESS:agent_dri_03@afrilandfirstbank.com}
  jwt:
    secret: ${JWT_SECRET}

  # Journal forensique scellé.
  audit:
    # Clé de scellement HMAC-SHA256, 32 octets au minimum.
    #
    # Elle ne doit JAMAIS être versionnée ni rangée à côté de la base : une clé
    # posée près des données qu'elle protège ne protège de rien face à qui a la
    # main sur la machine. En production elle vient d'un coffre, et le service
    # refuse de démarrer sans elle. Vide en développement : une clé éphémère est
    # alors utilisée, et le journal redevient invérifiable au redémarrage.
    hmac-key: ${AUDIT_HMAC_KEY:}

  # Alertes comportementales balayant le journal.
  alertes:
    # L'envoi de courriel est indépendant de la détection : les alertes sont
    # toujours écrites dans le journal scellé, qu'un serveur de messagerie
    # réponde ou non.
    envoi-actif: ${ALERTES_ENVOI_ACTIF:false}
    # Plusieurs adresses acceptées : une alerte de sécurité concerne rarement
    # une seule personne, et faire dépendre la chaîne d'alerte de la
    # disponibilité d'un individu est un point de rupture.
    destinataires: ${ALERTES_DESTINATAIRES:}
    intervalle-balayage-ms: ${ALERTES_INTERVALLE_MS:300000}
    # Seuils. Un seuil à zéro désactive la règle correspondante.
    seuil-kyc-echecs: ${ALERTES_SEUIL_KYC:2}
    seuil-otp-errones: ${ALERTES_SEUIL_OTP:3}
    seuil-vivacite-echecs: ${ALERTES_SEUIL_VIVACITE:3}

  # Microservice Python de vision (OCR, visage, vivacité, comparaison biométrique) — remplace
  # Mindee/AWS/CompreFace. Point d'entrée unique, jamais appelé directement par Angular.
  vision-service:
    base-url: ${VISION_SERVICE_URL:http://localhost:8001}
    api-key: ${VISION_SERVICE_API_KEY:changeme-local-dev-key}
  # WhatsApp banking (dépôt firstagent-demo) : source de vérité du client final. Ce microservice
  # y lit l'éligibilité et y écrit le client onboardé via l'API M2M à clé (jamais la base en direct).
  # api-key doit valoir la même chose que ONBOARDING_API_KEY côté firstagent-demo.
  whatsapp-banking:
    base-url: ${WHATSAPP_BANKING_URL:http://localhost:8000}
    api-key: ${WHATSAPP_BANKING_API_KEY:}
  ocr:
    min-confidence-score: 60
    name-similarity-threshold: 0.75
  identity:
    name-similarity-threshold: 0.70
  quality:
    # En dessous de ce score (document OU selfie), le dossier n'est pas rejeté mais enregistré
    # avec un statut "à réviser manuellement" pour finalisation par l'agence.
    manual-review-threshold: 70