spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/firstagent_onboarding
    username: postgres
    password: postgre
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway gère le schéma, Hibernate ne fait que valider
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false        # bonne pratique : évite les problèmes de lazy-loading hors contexte

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-on-validation-error: true
    out-of-order: true

  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:agent_dri_03@afrilandfirstbank.com}
    password: ${MAIL_PASSWORD:dummy-mail-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    upload-dir: ./uploads
  mail:
    from-address: ${MAIL_FROM_ADDRESS:agent_dri_03@afrilandfirstbank.com}
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtZW52aXJvbm1lbnQtY2hhbmdlbWU=}
  # Microservice Python de vision (visage, vivacité, comparaison biométrique) — l'OCR est
  # désormais servi par le moteur de la DEI ci-dessous (app.ocr-engine). Point d'entrée unique,
  # jamais appelé directement par Angular.
  vision-service:
    base-url: ${VISION_SERVICE_URL:http://localhost:8001}
    api-key: ${VISION_SERVICE_API_KEY:changeme-local-dev-key}
  # Moteur OCR de la DEI (Afriland First Bank — guide AFB_GI_OCR_DEI, RapidOCR). Extraction CNI
  # recto/verso. La reconnaissance faciale (/v1/face/*) n'est pas déployée sur ce service.
  # api-key : obligatoire, ne jamais versionner la vraie valeur — la renseigner via la variable
  # d'environnement OCR_ENGINE_API_KEY (voir backend/.env.example).
  ocr-engine:
    base-url: ${OCR_ENGINE_URL:http://62.169.26.178:8020}
    api-key: ${OCR_ENGINE_API_KEY:dummy-api-key}
  # WhatsApp banking (dépôt firstagent-demo) : source de vérité du client final. Ce microservice
  # y lit l'éligibilité et y écrit le client onboardé via l'API M2M à clé (jamais la base en direct).
  # api-key doit valoir la même chose que ONBOARDING_API_KEY côté firstagent-demo.
  whatsapp-banking:
    base-url: ${WHATSAPP_BANKING_URL:http://localhost:8000}
    api-key: ${WHATSAPP_BANKING_API_KEY:changeme-local-dev-key}
  ocr:
    min-confidence-score: 60
    name-similarity-threshold: 0.75
  identity:
    name-similarity-threshold: 0.70
  quality:
    # En dessous de ce score (document OU selfie), le dossier n'est pas rejeté mais enregistré
    # avec un statut "à réviser manuellement" pour finalisation par l'agence.
    manual-review-threshold: 70